    [[fixed.fixes]]
    description = "Initial carrying capacity V0 = K*T0 instead of the printed K = T0/V0 (i.e. V0 = T0/K)."
    evidence = "Methods before Eq. 6 prints K = T0/V0; Table 1 describes K as 'Initial ratio of V/T'; supplement MLXTRAN code (s004) has V_0 = K*X, T_0 = X; Fig 2b starts at V(38) = 140 = K*T0 with K = 2, T0 = 70 as stated in the caption."
    figures = []
    id = "K_is_V_over_T"
    kind = "typo"
    [[fixed.fixes]]
    description = "Figure 6: the resistance factor of Eq. 7 is exp(-lambda (t - tCon)), timed from the start of chemotherapy, instead of exp(-lambda t) with t read as days since inoculation."
    evidence = "Eq. 7 writes exp(-lambda t) and nowhere defines the origin of t; the text says resistance builds up during chemotherapy and is likely to matter more in Fig 6(d) (long course) than in Fig 6(c). Both readings are textually possible; the one used is stated here. No parameter value is changed."
    figures = ["fig6"]
    id = "resistance_clock_from_tCon"
    kind = "ambiguity"
    [[fixed.fixes]]
    description = "Figure 6: T0 = 80 mm^3 (Methods mean of 70 mm^3 not used) because the curves of all four panels start at T of about 80."
    evidence = "The paper gives no T0 for Figure 6. Value read from the starting point of the T curves in Figure 6 itself (a protocol input, not a model parameter); an independent rebuild from the paper alone read the same 80. Circular for this one value, hence the dagger."
    figures = ["fig6"]
    id = "T0_fig6_from_figure"
    kind = "from_target"

