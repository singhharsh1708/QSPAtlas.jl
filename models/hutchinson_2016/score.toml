    [[fixed.fixes]]
    basis = "supplement"
    description = "Initial carrying capacity V0 = K*T0 instead of the printed K = T0/V0 (i.e. V0 = T0/K)."
    evidence = "Methods before Eq. 6 prints K = T0/V0; Table 1 describes K as 'Initial ratio of V/T'; supplement MLXTRAN code (s004) has V_0 = K*X, T_0 = X; Fig 2b starts at V(38) = 140 = K*T0 with K = 2, T0 = 70 as stated in the caption. Stage: notes.md lists the typo with the equations and the first comparison run already had both runs."
    figures = []
    id = "K_is_V_over_T"
    kind = "typo"
    stage = "before_comparison"
    [[fixed.fixes]]
    basis = "figure"
    description = "Figure 6: T0 = 80 mm^3 (Methods mean of 70 mm^3 not used) because the curves of all four panels start at T of about 80."
    evidence = "The paper gives no T0 for Figure 6. Value read from the starting point of the T curves in Figure 6 itself (a protocol input, not a model parameter); an independent rebuild from the paper alone read the same 80, after its own comparison with the figure. Circular for this one value, hence the dagger."
    figures = ["fig6"]
    id = "T0_fig6_from_figure"
    kind = "from_target"
    stage = "after_comparison"

