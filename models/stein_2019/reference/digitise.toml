note = """Colour-run tracing of the light-blue (10th, 90th percentile) and light-pink (50th percentile) shaded areas of the Monolix VPC. \
Per pixel column, runs of band-coloured pixels are found (gaps up to 10 rows bridged: dots, the empirical percentile line and red outlier marks lie on the bands); \
upper blue run = 90th band, lower blue run = 10th band, pink run = 50th band; edges are the outer pixel boundaries; 5-column (right) or 11-column (left) running median. \
The blue lines (empirical percentiles of the data) and blue dots are NOT targets."""

