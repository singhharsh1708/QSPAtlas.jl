    [[fixed.fixes]]
    basis = "supplement"
    description = "Base model as in the supplement's mlxtran: Eq. 1 with the comedication effect of Eq. 2 entered per patient through the time-of-first-dose regressors (Ftoci 1.2, Fster 1.0), no covariate effects on Cmax."
    evidence = "Results: 'The base model characterized the data well, as shown by the visual predictive check ... in Figure 3' and 'the final cellular kinetic model was the same as the base model'. The mlxtran printed in Supplementary Material S1 (lines 100-152, 'the mlxtran code used for fitting the model') has parameter = {foldx, Tmax, Cmax, Ftoci, Fster, alpha, FB, beta} and regressor = {TOCI1T, STERSTT}; Table 1 lists Ftoci and Fster as fixed effects. The covariate model of the paper is the set of Cmax covariates (Table 1 'log Cmax covariate effect'), not used here. A Monolix VPC simulates each subject with its own regressors. Replaces base_model_no_comedication of the previous design. Stage: VPC design reconstruction of 2026-11-05, after the first comparison (2026-11-04) and the review round; an assumed reconstruction informed by the sources named, after the 2026-11-04 comedication sensitivity had shown the regressors improve agreement with the bands; the 4 of 6 is conditional on the settings marked :assumption."
    figures = []
    id = "mlx_base_model_regressors"
    kind = "ambiguity"
    stage = "after_comparison"
    [[fixed.fixes]]
    basis = "assumption"
    description = "Per-patient comedication regressors drawn from Table 2: tocilizumab with probability 0.36, first dose 5.7 d times exp(0.7 z) clamped to 1-27 d; corticosteroids with probability 0.26, 7.5 d times exp(1.2 z) clamped to 0.11-170 d (z standard normal); independent; none = no effect."
    evidence = "The patients' own regressors are in Data set S1 (supplement, PSP4-8-285-s002.csv: 32 of 90 with tocilizumab, median 5.75 d; 23 with steroids, median 7.45 d), which is not redistributed with this repository, so the graded run cannot read them. Table 2 gives the proportions, medians and ranges; the log-normal shape, its spread and the independence are assumptions, the same sampler as the comedication sensitivity pre-registered on 2026-11-04, which had already shown that these regressors improve agreement with the bands (4 of 6), so this choice is not blind to the target; the spreads have no independent evidence. reproduce(s1 = true) runs the design of Data set S1 itself when the file is present locally. Stage: VPC design reconstruction of 2026-11-05, after the first comparison (2026-11-04) and the review round; an assumed reconstruction informed by the sources named, after the 2026-11-04 comedication sensitivity had shown the regressors improve agreement with the bands; the 4 of 6 is conditional on the settings marked :assumption."
    figures = []
    id = "mlx_regressor_timing"
    kind = "missing"
    stage = "after_comparison"
