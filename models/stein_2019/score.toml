    [[fixed.fixes]]
    basis = "assumption"
    description = "Bins of the pooled observation times by the Monolix least-squares criterion (Lavielle & Bleakley 2011: beta 0.2, number of bins by log(J) + 0.3 beta K). On the nominal visits every visit is its own bin."
    evidence = "Lavielle & Bleakley, J Pharmacokinet Pharmacodyn 2011;38:861-871: the automatic binning implemented in Monolix 4 with these defaults. The paper does not state its Monolix version or bins; the Monolix 2024R1 documentation lists least-squares as an option with equal width as the default and an undocumented automatic bin count. With tied times a bin made of one visit has zero within-bin variance, so the criterion puts each visit in its own bin. Least-squares binning is therefore documented for Monolix 4 (and as an option in 2024R1, whose default is equal width), not for the version the paper used: an assumption. Stage: VPC design reconstruction of 2026-11-05, after the first comparison (2026-11-04) and the review round; an assumed reconstruction informed by the sources named, after the 2026-11-04 comedication sensitivity had shown the regressors improve agreement with the bands; the 4 of 6 is conditional on the settings marked :assumption."
    figures = []
    id = "mlx_ls_binning"
    kind = "missing"
    stage = "after_comparison"
    [[fixed.fixes]]
    basis = "assumption"
    description = "Each bin's percentile is placed at the mean observation time of the bin and the nodes are joined by straight segments in (day, log10 copies)."
    evidence = "Lavielle & Bleakley 2011 take the bin mean time as the time that represents the bin; where Monolix draws the node is not documented. On the nominal visits the node is the visit time. Stage: VPC design reconstruction of 2026-11-05, after the first comparison (2026-11-04) and the review round; an assumed reconstruction informed by the sources named, after the 2026-11-04 comedication sensitivity had shown the regressors improve agreement with the bands; the 4 of 6 is conditional on the settings marked :assumption."
    figures = []
    id = "mlx_bin_node_mean_time"
    kind = "missing"
    stage = "after_comparison"
    [[fixed.fixes]]
    basis = "assumption"
    description = "Percentiles of each bin by Hyndman-Fan type 5 (piecewise linear, R5), not type 7."
    evidence = "Monolix 2024R1 VPC documentation: 'The calculation of percentiles follows the piecewise linear method, also called R5 method.' Whether the version used for the paper did the same is not documented (the 2016R1 to 2019R1 pages could not be retrieved), so the convention is an assumption for the paper's era. QSPAtlas `percentiles` has type 7 only, so type 5 is computed in this model's protocol.jl. Stage: VPC design reconstruction of 2026-11-05, after the first comparison (2026-11-04) and the review round; an assumed reconstruction informed by the sources named, after the 2026-11-04 comedication sensitivity had shown the regressors improve agreement with the bands; the 4 of 6 is conditional on the settings marked :assumption."
    figures = []
    id = "mlx_percentile_r5"
    kind = "missing"
    stage = "after_comparison"
    [[fixed.fixes]]
    basis = "reference"
    description = "All simulated values, including those below the LLOQ of 50 copies/ug, enter the simulated percentiles (no censoring of the simulated data)."
    evidence = "Methods: BLQ data were fixed-point censored (CENSORING column); caption: red asterisks are simulated values for the BLQ measurements (the Monolix 'BLQ simulated' display). Monolix documentation, 'Correcting the VPC for missing observations' (2024R1): with censored data used and simulated, 'all simulated values are used to calculate the simulated percentiles'. Documented for 2024R1; the paper's caption (simulated BLQ points shown) is consistent with it. Replaces blq_kept of the previous design (same numbers, now with a source). Stage: VPC design reconstruction of 2026-11-05, after the first comparison (2026-11-04) and the review round; an assumed reconstruction informed by the sources named, after the 2026-11-04 comedication sensitivity had shown the regressors improve agreement with the bands; the 4 of 6 is conditional on the settings marked :assumption."
    figures = []
    id = "mlx_blq_simulated"
    kind = "ambiguity"
    stage = "after_comparison"
    [[fixed.fixes]]
    basis = "reference"
    description = "Prediction interval 90 % over the simulated replicates (Monolix default; 500 simulations). The compared quantity is the median over replicates of each simulated percentile, with as many replicates as the Monte Carlo rule needs."
    evidence = "Monolix 2024R1 VPC documentation: 'By default 500 simulations are performed', 'By default, prediction intervals are computed with a level of 90%'; Lavielle & Bleakley 2011 (Monolix 4) also use 90 %. The interval level only sets the displayed band in figures/fig3.png; the score compares the median of each simulated percentile with the authors' band. Stage: VPC design reconstruction of 2026-11-05, after the first comparison (2026-11-04) and the review round; an assumed reconstruction informed by the sources named, after the 2026-11-04 comedication sensitivity had shown the regressors improve agreement with the bands; the 4 of 6 is conditional on the settings marked :assumption."
    figures = []
