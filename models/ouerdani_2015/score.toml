    evidence = "Results: mean exposure of the 47 patients 771.6 ug*h/mL (range 629.4-802.4); Supplementary Table 2 uses 800. 771.6 is the only value the text ties to the population. Not chosen by matching: 800 fits K about six times tighter and was not adopted (report.md, Sensitivity). Stage: the notes record only that these inputs were tried after the 09:44 freeze; the exact order is not recorded, so :after_comparison."
