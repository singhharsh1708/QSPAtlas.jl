# Digitisation settings for fornari_2019. Regenerate all CSVs with
#   julia --project=tools/digitise models/fornari_2019/reference/digitise_run.jl
# Images (not in the repository, see tools/digitise/README.md): $QSPATLAS_PAPERS/fornari_2019/supplement/PSP4-8-858-g003.jpg (Figure 3) and ...-g004.jpg (Figure 4),
# both 709 px wide JPEGs (PMC6875710). Pixel coordinates are 1-based (row, col) of the Julia image array.
#
# TARGETS FROZEN: 2026-11-04 (before any simulation of this model was run; see ../notes.md)
#
# Mask "redline": pixel kept when red > 0.4 and red - green > 0.20. The authors' mean-prediction line is red; where it
# lies over the blue percentile bands it is a dull red-purple (about 0.5, 0.22, 0.47) but still has red well above green,
# while band pixels have green >= red and black markers have red < 0.4. Per image column the median matched row is kept
# (a vertical drop becomes one point at its middle, which lies on the line).
#
# Calibration:
#  Figure 3 x: centroids of the tick labels "0" and "120" (dark-pixel column centroid in the 9 rows under the frame);
#     the label "60" (extra tick, not used) lies within 0.5 px of the interpolated position.
#  Figure 3 y (log): row centroid of the "10^k" label base digits (darkness-weighted, window left of the frame) minus 0.5 px
#     (MATLAB places the tick on the middle of the label box, base digits sit about 0.5 px lower; consistent offset found by
#     template-fitting the minor ticks on the right frame of MPP, MEP, Neut). MEP has three labels (10^2, 10^1, 10^0);
#     10^1 is the extra check tick for that panel (not used for calibration).
#  Figure 4 x: tick-label/tick column centroids at day 0 and day 40 per panel (panels are mis-registered by up to 1.5 px between
#     the (a)/(b) and neutrophil/platelet sub-panels, so each is calibrated separately); day 20 tick is the check. All frames end at x = 42.4 d.
#  Figure 4 y (log): per-panel frame rows (top/bottom line centres) are the axis limits (neutrophil panels 1e-1..1e2, platelet panels 1e1..1e4, label text on the
#     frame edges); the grade 3/4 threshold lines (neutrophils 1.0 and 0.5; platelets 50 and 25) are the check ticks.

