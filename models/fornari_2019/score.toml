    [[fixed.fixes]]
    basis = "supplement"
    description = "Table S3 rat PK printed as QC 0.06 '1/h', VCen 0.26 'l', VPer 0.30 'l', CL 0.42 '1/h' (code: liter/hour, liter). Read per kg (L/kg, L/h/kg) with the dose per kg: d mg/kg enters Cen as d x 1000 / 371.25 umol/kg (2.694 umol/kg per mg/kg; 107.7 at 40 mg/kg), Cp = Cen/VCen in umol/L."
    evidence = "(1) Table S3 was estimated by fitting Eq S1 to the Fig S3 free-Pt data (Table S3 caption). Read per kg, the model reproduces those data (in-house 30 mg/kg, 16 points: geometric mean obs/model 0.93; Siddik 20 mg/kg, 10 points: 1.22); read as litres for a 0.320 kg rat it is 2.9x and 3.8x below them. These are PK data, not targets. (2) The cited PK source, Siddik et al. 1987 (Biochem Pharmacol 36:1925; abstract only, full text not accessed), reports carboplatin plasma clearance 10.3 mL/min/kg and inulin clearance 10.1 mL/min/kg in a study of mice and rats (the abstract does not say which species these values are from); read per kg, CL 0.42 L/h/kg is 7.0 mL/min/kg, the same order. As absolute litres for a 0.320 kg rat (S1) CL is 21.9 mL/min/kg, implausibly twice the GFR of a drug cleared mainly by filtration, and VCen 0.81 L/kg (Vss 1.75 L/kg) exceeds total body water (~0.67 L/kg) for a hydrophilic drug; per kg VCen 0.26 L/kg is extracellular water. (3) The Fig S3 data also give a model-free clearance of 0.47 L/h per kg (0.15 L/h for a 0.320 kg rat) against the printed 0.42. No value is fitted: Table S3 numbers are used unchanged; the 0.320 kg absolute reading (0.862 umol per mg/kg) is a sensitivity run. Nothing in the paper says 'per kg': the fitted values behave as per-kg values. Stage: adopted after an independent rebuild found that this reading matches Fig 3; the evidence above does not use Fig 3 or Fig 4 (selfcheck units resolution, 2026-11-05)."
