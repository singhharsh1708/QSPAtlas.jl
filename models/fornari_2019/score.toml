    [[fixed.fixes]]
    basis = "paper"
    description = "Eq 1 maturation terms read -ktr_CMP fdbk_mat_MPP - ktr_MEP fdbk_mat_MPP. Used: -ktr_CMP fdbk_mat_CMP MPP - ktr_MEP fdbk_mat_MEP MPP."
    evidence = "fdbk_mat_MPP is not defined anywhere (Eq 12 defines fdbk_mat_CMP, fdbk_mat_MEP); Eq 4 gain terms ktr_CMP fdbk_mat_CMP MPP and ktr_MEP fdbk_mat_MEP MPP are the same fluxes; supplement S4 kstem = (ktrCMP+ktrMEP-kprolMPP) MPP0 only closes the MPP steady state if the outflow is proportional to MPP; text on Eq 12 says the feedbacks are 'integrated in Eqs 1 and 4'. Stage: listed in notes.md before any simulation was compared (equations, 'Missing / ambiguous inputs found', 'Human-parameter rule')."
    figures = []
    id = "eq1_maturation"
    kind = "typo"
    stage = "before_comparison"
    [[fixed.fixes]]
    basis = "supplement"
    description = "Eq 9 prints only Neut, Mono, Ret, Plt. Added dRBC/dt = kcirc_Ret Ret - kcirc_RBC RBC."
    evidence = "Table 1 lists kcirc_RBC and the RBC baseline; Eqs 12-13 use RBC as a feedback signal; supplement S4 defines kcirc_Ret = kcirc_RBC RBC0/Ret0 (steady state of exactly this equation); S2 lists RBC among the states. Stage: listed in notes.md before any simulation was compared (equations, 'Missing / ambiguous inputs found', 'Human-parameter rule')."
